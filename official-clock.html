<meta charset="utf-8">
<title>MY:TIME x LACOSTE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --accent: #ccee00;
    --hand: #fff;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Rajdhani', sans-serif;
    color: var(--hand);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* The composition is authored at 1920x1080, then scaled to fit
     whatever viewport it lands in - fullscreen, windowed, any zoom. */
  .frame {
    position: relative;
    flex: none;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(var(--fit, 1));
    transform-origin: center center;
  }

  /* Ambient glow tracks the dial, not the frame edge */
  .frame::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 55% 55% at 50% 54.7%, rgba(184,212,0,0.045) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* The whole lockup: logo, rule, dial - centered as one block */
  .stage {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .top-brand {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-brand img {
    height: 102px;
    width: auto;
    filter: invert(1);
    opacity: 1;
  }

  .brand-rule {
    width: 220px;
    height: 3px;
    margin: 16px 0 51px;
    background: var(--accent);
    opacity: 1;
  }

  .clock-wrap {
    position: relative;
  }

  .bezel {
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      #232323 0deg, #2f2f2f 20deg,
      #1a1a1a 40deg, #272727 80deg,
      #232323 120deg, #2f2f2f 140deg,
      #1a1a1a 160deg, #272727 200deg,
      #232323 240deg, #2f2f2f 260deg,
      #1a1a1a 280deg, #272727 320deg,
      #232323 360deg
    );
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 0 80px rgba(0,0,0,0.95),
      0 0 140px rgba(0,0,0,0.6),
      inset 0 0 0 2px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bezel-inner {
    width: 612px;
    height: 612px;
    border-radius: 50%;
    background: #0c0c0c;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), inset 0 4px 40px rgba(0,0,0,0.9);
  }

  .clock-face {
    width: 594px;
    height: 594px;
    border-radius: 50%;
    position: relative;
    background: #000;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14);
    overflow: hidden;
  }

  .clock-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center-logo img {
    width: 136px;
    height: 136px;
    object-fit: contain;
    opacity: 0.90;
    filter: drop-shadow(0 0 14px rgba(184,212,0,0.28)) drop-shadow(0 0 4px rgba(0,0,0,0.9));
  }

  .pivot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle, #d8f000 0%, #b8d400 60%, #8ea000 100%);
    box-shadow: 0 0 12px rgba(184,212,0,0.8), 0 0 4px rgba(184,212,0,0.5);
    z-index: 30;
  }

  .hands-layer {
    position: absolute;
    inset: 0;
    z-index: 25;
  }

  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 3px 3px 2px 2px;
  }

  .hand-hour {
    width: 12px;
    height: 158px;
    margin-left: -6px;
    background: #fff;
    border-radius: 4px 4px 3px 3px;
    box-shadow: 0 0 12px rgba(0,0,0,0.9);
  }

  .hand-minute {
    width: 7px;
    height: 228px;
    margin-left: -3.5px;
    background: #fff;
    border-radius: 3px 3px 2px 2px;
    box-shadow: 0 0 10px rgba(0,0,0,0.9);
  }

  .hand-second {
    width: 4px;
    height: 255px;
    margin-left: -2px;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(184,212,0,0.7), 0 0 24px rgba(184,212,0,0.25);
    border-radius: 2px;
  }

  .hand-second::after {
    content: '';
    position: absolute;
    bottom: -50px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 46px;
    background: rgba(184,212,0,0.5);
    border-radius: 2px;
  }

  /* Large readout under the dial — the one people actually read at a glance */
  .big-time {
    margin-top: 44px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 132px;
    line-height: 1;
    letter-spacing: 0.06em;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(0,0,0,0.9);
  }
  .big-time .sep { color: var(--accent); }
  .big-date {
    margin-top: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
  }

  .digital-display {
    position: absolute;
    bottom: 162px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.75);
    text-transform: uppercase;
    z-index: 15;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .date-display {
    position: absolute;
    bottom: 104px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    white-space: nowrap;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.25em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }
</style>

<script>
  // Scale the 1920x1080 composition to the viewport so it stays
  // optically centered at any window size or browser zoom.
  function fitToViewport() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.documentElement.style.setProperty('--fit', scale);
  }
  fitToViewport();
  window.addEventListener('resize', fitToViewport);
  window.addEventListener('orientationchange', fitToViewport);

  const svg = document.getElementById('clockSvg');
  const NS = 'http://www.w3.org/2000/svg';
  const cx = 297, cy = 297, r = 280;

  const romanNumerals = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];

  // Draw ticks
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6 - 90) * Math.PI / 180;
    const isMajor = i % 5 === 0;
    const isQuarter = i % 15 === 0;

    const outerR = r - 4;
    const innerR = isQuarter ? r - 30 : isMajor ? r - 22 : r - 13;

    const x1 = cx + outerR * Math.cos(angle);
    const y1 = cy + outerR * Math.sin(angle);
    const x2 = cx + innerR * Math.cos(angle);
    const y2 = cy + innerR * Math.sin(angle);

    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));

    if (isQuarter) {
      line.setAttribute('stroke', '#ccee00');
      line.setAttribute('stroke-width', '7');
    } else if (isMajor) {
      line.setAttribute('stroke', '#fff');
      line.setAttribute('stroke-width', '5');
    } else {
      line.setAttribute('stroke', 'rgba(255,255,255,0.7)');
      line.setAttribute('stroke-width', '2.5');
    }
    svg.appendChild(line);

    // Numerals
    if (isMajor) {
      const numR = isQuarter ? r - 56 : r - 48;
      const nx = cx + numR * Math.cos(angle);
      const ny = cy + numR * Math.sin(angle);
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', nx.toFixed(2));
      text.setAttribute('y', ny.toFixed(2));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('font-family', 'Rajdhani, sans-serif');
      text.setAttribute('fill', isQuarter ? '#fff' : 'rgba(255,255,255,0.85)');
      text.setAttribute('font-size', isQuarter ? '34' : '26');
      text.setAttribute('font-weight', isQuarter ? '600' : '500');
      text.setAttribute('letter-spacing', '1');
      text.textContent = romanNumerals[i / 5];
      svg.appendChild(text);
    }
  }

  // Subtle concentric ring
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy); ring.setAttribute('r', r - 1);
  ring.setAttribute('fill', 'none'); ring.setAttribute('stroke', 'rgba(255,255,255,0.16)'); ring.setAttribute('stroke-width', '2');
  svg.appendChild(ring);

  // Clock update
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const digitalTime = document.getElementById('digitalTime');
  const dateDisplay = document.getElementById('dateDisplay');
  const bigTime = document.getElementById('bigTime');
  const bigDate = document.getElementById('bigDate');

  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function updateClock() {
    const now = new Date();
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    const sDeg = (s + ms / 1000) * 6;
    const mDeg = (m + s / 60) * 6;
    const hDeg = ((h % 12) + m / 60) * 30;

    hourHand.style.transform = 'rotate(' + hDeg + 'deg)';
    minuteHand.style.transform = 'rotate(' + mDeg + 'deg)';
    secondHand.style.transform = 'rotate(' + sDeg + 'deg)';

    const hh = String(h).padStart(2,'0');
    const mm = String(m).padStart(2,'0');
    const ss = String(s).padStart(2,'0');
    digitalTime.textContent = hh + ' : ' + mm + ' : ' + ss;
    bigTime.innerHTML = hh + '<span class="sep">:</span>' + mm + '<span class="sep">:</span>' + ss;

    const day = DAYS[now.getDay()];
    const date = now.getDate();
    const month = MONTHS[now.getMonth()];
    const year = now.getFullYear();
    dateDisplay.textContent = day + '  ·  ' + month + ' ' + date + ', ' + year;
    bigDate.textContent = day + '  ·  ' + month + ' ' + date + ', ' + year;

    requestAnimationFrame(updateClock);
  }

  updateClock();
</script>
